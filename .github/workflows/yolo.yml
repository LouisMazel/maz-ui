name: Yoloship

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Pre-created YoloShip run id (set by the dashboard trigger)
        required: false
  issues:
    types: [opened, labeled]

jobs:
  run-agent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'yolo' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js, pnpm and caches
        uses: ./.github/actions/setup

      - name: Run Yolo Ship CLI
        env:
          YOLO_RUN_ID: ${{ github.event.inputs.run_id }}
          YOLO_API_KEY: ${{ secrets.YOLO_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GIT_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: pnpm yolo run
