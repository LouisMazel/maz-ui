# .github/workflows/check-deps.yml
name: Check Dependencies

on:
  pull_request:

jobs:
  check-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js, pnpm and Nx cache
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm exec nx run @maz-ui/node:build

      - name: Check the catalog and the peer dependencies
        run: node .github/scripts/check-deps.mjs
