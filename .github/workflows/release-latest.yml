name: Release Latest

on:
  push:
    branches:
      - master
    paths:
      - 'packages/**/*'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/package.json'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-latest:
    name: Release Latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js, pnpm and Nx cache
        uses: ./.github/actions/setup

      # The changelogs are formatted with ESLint before the packages are built: its config must exist
      - name: Build the ESLint config
        run: pnpm -F @maz-ui/eslint-config build

      # The project is set up above: the action runs `relizy release --yes` and installs the claude CLI. The packages
      # are built by the `before:publish` hook of relizy.config.ts: the published ones only, after the bump
      - name: Version Packages (Latest)
        id: release
        uses: relizy/action@v2
        with:
          setup: false
          args: --tag latest
          github-token: ${{ secrets.RELEASE_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          claude-code-oauth-token: ${{ secrets.YOLO_PROVIDER_API_KEY }}
          twitter-api-key: ${{ secrets.TWITTER_API_KEY }}
          twitter-api-key-secret: ${{ secrets.TWITTER_API_KEY_SECRET }}
          twitter-access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          twitter-access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
