name: Linters

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'tools/**'
      - pnpm-lock.yaml
      - .github/workflows/linters.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: linters
    runs-on: ubuntu-latest

    steps:
      # The full history: nx compares the pull request with its base branch
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js, pnpm and Nx cache
        id: setup
        uses: ./.github/actions/setup

      - name: Run linters
        run: pnpm exec nx ${{ steps.setup.outputs.nx-scope }} -t lint

      - name: Run relizy commitlint
        run: pnpm relizy commitlint
