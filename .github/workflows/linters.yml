name: Linters

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'tools/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - pnpm-lock.yaml
      - .github/workflows/linters.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: linters
    runs-on: ubuntu-latest

    steps:
      # The full history: nx compares the pull request with its base branch
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js, pnpm and Nx cache
        id: setup
        uses: ./.github/actions/setup

      - name: Run linters
        run: pnpm exec nx ${{ steps.setup.outputs.nx-scope }} -t lint

  # The manifests of the Claude Code plugin and of its marketplace, as Claude Code reads them at install
  claude-plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate the plugin and the marketplace
        run: |
          npx -y @anthropic-ai/claude-code plugin validate plugins/claude-code
          npx -y @anthropic-ai/claude-code plugin validate .
