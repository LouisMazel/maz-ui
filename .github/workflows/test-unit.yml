name: Unit Tests

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/test-unit.yml
      - 'packages/**/*'
      - 'tools/agent-docs/**'
      - 'apps/docs/src/**'
      - 'plugins/**'
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/package.json'
  pull_request:
    paths:
      - .github/workflows/test-unit.yml
      - 'packages/**'
      - 'tools/agent-docs/**'
      - 'apps/docs/src/**'
      - 'plugins/**'
      - pnpm-lock.yaml

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TEST_ENV: 'true'

    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: Europe/Paris
          timezoneMacos: Europe/Paris

      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js, pnpm and Nx cache
        uses: ./.github/actions/setup

      - name: Test units
        run: pnpm test:unit:coverage:all

      # The coverage report of every tested package, uploaded at once: codecov.yml splits it by package (components).
      # The paths of a report are relative to its package: prefixed with the package directory, two files with the
      # same name in two packages (`src/cli.ts`) cannot be mixed up
      - name: Collect the coverage reports
        id: coverage
        run: |
          reports=()
          for report in packages/*/coverage/lcov.info; do
            package="${report%/coverage/lcov.info}"
            perl -pi -e "s|^SF:(?!packages/)|SF:$package/|" "$report"
            reports+=("$report")
          done
          echo "files=$(IFS=,; echo "${reports[*]}")" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.files }}
          disable_search: true
          fail_ci_if_error: true
