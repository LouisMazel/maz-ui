name: Build and Typecheck

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/docs/**'
      - pnpm-lock.yaml
      - .github/workflows/build-and-typecheck.yml
      - .github/scripts/check-dist-imports.mjs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: build-and-typecheck
    runs-on: ubuntu-latest

    env:
      TEST_ENV: 'true'
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      # The full history: nx compares the pull request with its base branch
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js, pnpm and Nx cache
        id: setup
        uses: ./.github/actions/setup

      # The packages and the docs changed by the pull request, and their dependents (the demo apps are not built)
      - name: Build
        run: pnpm exec nx ${{ steps.setup.outputs.nx-scope }} -t build --exclude=vue-app,nuxt-app

      - name: Check the packages imported by the published files
        run: node .github/scripts/check-dist-imports.mjs

      - name: Typecheck
        run: pnpm exec nx ${{ steps.setup.outputs.nx-scope }} -t typecheck
