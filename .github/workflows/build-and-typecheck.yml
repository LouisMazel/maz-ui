name: Build and Typecheck

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/docs/**'
      - pnpm-lock.yaml
      - .github/workflows/build-and-typecheck.yml
      - .github/scripts/check-dist-imports.mjs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: build-and-typecheck
    runs-on: ubuntu-latest

    env:
      TEST_ENV: 'true'
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js, pnpm and Nx cache
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build:packages

      - name: Check the packages imported by the published files
        run: node .github/scripts/check-dist-imports.mjs

      - name: Typecheck packages
        run: pnpm typecheck:all

      - name: Build docs
        run: pnpm exec nx run docs:build
