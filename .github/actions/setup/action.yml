name: 'Setup Node.js, pnpm and Nx cache'
description: Setup Node.js with pnpm and configure Nx cache for faster builds

inputs:
  install-flags:
    description: Additional flags for pnpm install
    required: false
    default: --frozen-lockfile --ignore-scripts

runs:
  using: composite
  steps:
    # pnpm and the store cache only: Node.js comes from actions/setup-node and the install runs
    # below with the flags of this action
    - name: Setup pnpm
      uses: pnpm/setup@v3
      with:
        cache: true
        install: false
        node-version-file: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # One cache per run (the sha), restored from the latest one with the same config and lockfile,
    # then from any previous one: an existing key is never overwritten by actions/cache
    - name: Setup Nx cache
      uses: actions/cache@v6
      with:
        path: |
          .nx/cache
          .nx/workspace-data
        key: ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}-
          ${{ runner.os }}-nx-

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-flags }}
