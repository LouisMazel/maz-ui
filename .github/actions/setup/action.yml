name: 'Setup Node.js, pnpm and Nx cache'
description: Setup Node.js with pnpm and configure Nx cache for faster builds

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '24'
  registry-url:
    description: npm registry URL
    required: false
  install-flags:
    description: Additional flags for pnpm install
    required: false
    default: --frozen-lockfile --ignore-scripts

runs:
  using: composite
  steps:
    # pnpm and the store cache only: Node.js comes from actions/setup-node (npm auth of the
    # releases via registry-url) and the install runs below with the flags of this action
    - name: Setup pnpm
      uses: pnpm/setup@v3
      with:
        cache: true
        install: false
        node-version-file: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup Nx cache
      uses: actions/cache@v6
      with:
        path: |
          .nx/cache
          .nx/workspace-data
        key: ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-flags }}
