# Codecov configuration: https://docs.codecov.com/docs/codecov-yaml
# Validate it with `curl --data-binary @codecov.yml https://codecov.io/validate`
#
# test-unit.yml uploads the coverage of every tested package at once. What a package counts as covered is set by
# its Vitest config (`coverage.include` / `coverage.exclude`), not here.

codecov:
  max_report_age: off

coverage:
  precision: 2
  round: down
  range: 80..100

  status:
    # The whole repository: no drop of more than 0.5% compared to the base of the pull request
    project:
      default:
        target: auto
        threshold: 0.5%

    # The lines added or changed by a pull request
    patch:
      default:
        target: 80%
        only_pulls: true

comment:
  layout: 'header, diff, components, files, footer'
  behavior: default

# One component per tested package: its coverage in the pull request comment, and its own status.
# A new tested package is uploaded automatically: add it here to see it apart.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%

  # `component_id` keeps the history of a component: never change it
  individual_components:
    - component_id: lib
      name: maz-ui
      paths:
        - packages/maz-ui/**

    - component_id: eslint-config
      name: '@maz-ui/eslint-config'
      paths:
        - packages/eslint-config/**

    - component_id: mcp
      name: '@maz-ui/mcp'
      paths:
        - packages/mcp/**

    - component_id: node
      name: '@maz-ui/node'
      paths:
        - packages/node/**

    - component_id: nuxt
      name: '@maz-ui/nuxt'
      paths:
        - packages/nuxt/**

    - component_id: stylelint-config
      name: '@maz-ui/stylelint-config'
      paths:
        - packages/stylelint-config/**

    - component_id: themes
      name: '@maz-ui/themes'
      paths:
        - packages/themes/**

    - component_id: translations
      name: '@maz-ui/translations'
      paths:
        - packages/translations/**

    - component_id: upgrade
      name: '@maz-ui/upgrade'
      paths:
        - packages/upgrade/**

    - component_id: utils
      name: '@maz-ui/utils'
      paths:
        - packages/utils/**
