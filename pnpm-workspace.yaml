minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@yoloship/*'
  - '@maz-ui/node@5.0.0-beta.26'
  - relizy*

# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off
shellEmulator: true

packages:
  - apps/*
  - packages/*
  - tools/*
  - .

allowBuilds:
  '@modelcontextprotocol/inspector': false
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  nx: true
  sharp: false
  vue-demi: true

permissions:
  '@modelcontextprotocol/inspector':
    skills: false
