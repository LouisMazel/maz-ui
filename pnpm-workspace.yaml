minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@yoloship/*'
  - '@maz-ui/*'
  - relizy*
  - '@relizy/core@2.3.0'

# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off
shellEmulator: true
# Fails the install when the Node.js version is outside the `engines` of a project or of a dependency
engineStrict: true

packages:
  - apps/*
  - packages/*
  - tools/*
  - .

allowBuilds:
  '@modelcontextprotocol/inspector': false
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  nx: true
  sharp: false
  vue-demi: true

permissions:
  '@modelcontextprotocol/inspector':
    skills: false

# Versions of the dependencies shared by several projects of the workspace, referenced with `catalog:`
catalog:
  '@clack/prompts': ^1.9.0
  '@codecov/vite-plugin': ^2.0.1
  '@nuxt/devtools': ^3.4.4
  '@tailwindcss/postcss': ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  '@types/node': ^26.6.6
  '@vitejs/plugin-vue': ^6.0.10
  '@vitest/coverage-v8': ^5.1.0
  chart.js: ^4.6.1
  colorette: ^2.0.20
  commander: ^15.1.0
  consola: ^3.4.2
  cross-env: ^10.1.0
  dayjs: ^1.11.23
  eslint: ^10.14.0
  figlet: ^1.12.0
  glob: ^14.0.4
  libphonenumber-js: ^1.13.16
  nuxt: ^4.6.4
  postcss: ^8.5.32
  postcss-nested: ^9.0.1
  shiki: ^4.6.0
  stylelint: ^17.16.0
  tailwindcss: ^4.3.5
  tinyglobby: ^0.2.17
  tsx: ^4.23.15
  typescript: ^6.0.3
  unbuild: ^3.6.1
  unplugin-auto-import: ^21.1.0
  unplugin-vue-components: ^32.1.0
  valibot: ^1.5.0
  vite: ^8.3.7
  vite-plugin-dts: ^5.1.2
  vite-svg-loader: ^5.1.3
  vitest: 5.1.0
  vue: ^3.5.45
  vue-router: ^5.5.0
  vue-tsc: 3.3.14
  yaml: ^2.9.1
  zod: ^4.6.7
